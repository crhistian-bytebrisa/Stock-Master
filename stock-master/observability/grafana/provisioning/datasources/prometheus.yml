apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Sin esto el panel Node graph no dibuja nada: Grafana solo transforma la
      # traza a nodos y aristas cuando la datasource tiene el node graph activo.
      nodeGraph:
        enabled: true
