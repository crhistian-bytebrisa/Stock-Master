spring.application.name=stock-master

# PostgreSQL local. Estas propiedades pueden reemplazarse con variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockmaster}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:stockmaster}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:stockmaster}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Base de logging: los traceId y spanId permiten correlacionar cada mensaje.
logging.level.com.example.stockmaster=INFO
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

# Base de tracing para el ejemplo. Se muestrean todas las solicitudes.
management.tracing.sampling.probability=1.0

# No se exportan trazas mientras no exista un backend como Tempo.
management.tracing.export.otlp.enabled=false

# Se exponen solamente los endpoints mínimos de Actuator.
management.endpoints.web.exposure.include=health,info
