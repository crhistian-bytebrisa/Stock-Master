spring.application.name=stock-master

# Base de logging: los traceId y spanId permiten correlacionar cada mensaje.
logging.level.com.example.stockmaster=INFO
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

# Base de tracing para el ejemplo. Se muestrean todas las solicitudes.
management.tracing.sampling.probability=1.0

# No se exportan trazas mientras no exista un backend como Tempo.
management.tracing.export.otlp.enabled=false

# Se exponen solamente los endpoints mínimos de Actuator.
management.endpoints.web.exposure.include=health,info
