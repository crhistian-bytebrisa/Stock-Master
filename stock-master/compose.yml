name: stock-master

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockmaster}
      POSTGRES_USER: ${POSTGRES_USER:-stockmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockmaster}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  application:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-master:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-stockmaster}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stockmaster}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-stockmaster}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: "false"
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
