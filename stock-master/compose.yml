## Entorno de ejemplo para Stock Master.
##
## Decisión de alcance:
## Este archivo se mantendrá intencionalmente simple y su estado final incluirá
## únicamente la aplicación y PostgreSQL. No se añadirá una pila completa de
## observabilidad para evitar sobreingeniería en un proyecto demostrativo.
##
## La aplicación solo mostrará los conceptos de logging y tracing desde el
## código. Loki y Tempo pueden mencionarse como posibles integraciones, pero no
## se desplegarán aquí. Tampoco se incluirán métricas, Prometheus ni Grafana.
